<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>詐欺を切れ！</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #202020;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            padding: 10px;
            overflow: hidden;
        }
        .game {
            width: min(100%, 460px);
            height: min(760px, calc(100svh - 20px));
            min-height: 0;
            background: linear-gradient(#2b2b2b, #171717);
            border: 6px solid #444;
            border-radius: 18px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55);
            padding: 18px;
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.16s ease, border-color 0.16s ease;
        }
        .game.flash-correct {
            border-color: #64d46f;
            box-shadow: 0 0 0 4px rgba(100, 212, 111, 0.22), 0 12px 28px rgba(0, 0, 0, 0.55);
        }
        .game.flash-wrong {
            border-color: #e06969;
            box-shadow: 0 0 0 4px rgba(224, 105, 105, 0.24), 0 12px 28px rgba(0, 0, 0, 0.55);
        }
        .screen { display: none; flex: 1; flex-direction: column; }
        .screen.active { display: flex; }
        .title { justify-content: center; gap: 20px; text-align: center; }
        .phone { font-size: 44px; line-height: 1; }
        h1 { font-size: 34px; letter-spacing: 0; }
        .subtitle, .small { color: #cfcfcf; font-size: 14px; line-height: 1.7; }
        .rule, .panel {
            border: 2px solid #666;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            padding: 14px;
            line-height: 1.8;
            font-size: 15px;
        }
        .rule { text-align: left; }
        .difficulty, .actions, .chips {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        button {
            border: 3px solid #777;
            border-radius: 8px;
            background: #333;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }
        button:active { transform: translateY(1px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .difficulty button { padding: 8px 14px; font-size: 14px; }
        .difficulty button.selected { background: #666; border-color: #aaa; }
        .start, .restart { align-self: center; padding: 15px 34px; font-size: 20px; }
        .play { gap: 14px; }
        .hud {
            display: flex;
            justify-content: space-between;
            border: 2px solid #5c5c5c;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.28);
            padding: 12px;
            font-family: "Courier New", monospace;
            font-weight: 700;
        }
        .stage-strip {
            min-height: 34px;
            border: 2px solid #505050;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d8d8d8;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            padding: 6px 10px;
        }
        .call {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 18px;
            border: 3px solid #5c5c5c;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            padding: 20px;
            min-height: 0;
        }
        .line {
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.65;
            font-size: 20px;
        }
        .line:first-child { color: #c8c8c8; font-weight: 700; }
        .actions button { flex: 1; padding: 16px 10px; font-size: 18px; }
        .accept { background: #28562e; border-color: #4f9a5b; }
        .cut { background: #662b2b; border-color: #b55454; }
        .feedback {
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            white-space: pre-line;
            font-weight: 700;
            line-height: 1.5;
        }
        .result { gap: 12px; overflow-y: auto; text-align: center; padding-right: 2px; }
        .score { font-size: 42px; font-family: "Courier New", monospace; font-weight: 700; }
        .panel { text-align: left; font-size: 14px; }
        .panel-title { font-weight: 700; color: #fff; text-align: center; margin-bottom: 6px; }
        .chips { list-style: none; }
        .chips li {
            border: 1px solid #777;
            border-radius: 5px;
            padding: 3px 7px;
            background: rgba(0, 0, 0, 0.22);
        }
        @media (max-width: 480px) {
            body {
                align-items: stretch;
                padding: 8px;
            }
            .game {
                width: 100%;
                height: calc(100svh - 16px);
                border-width: 5px;
                border-radius: 16px;
                padding: 14px;
            }
            .title { gap: 16px; }
            .phone { font-size: 38px; }
            h1 { font-size: 30px; }
            .rule, .panel {
                padding: 12px;
                line-height: 1.7;
                font-size: 14px;
            }
            .difficulty button {
                min-width: 72px;
                padding: 8px 10px;
            }
            .start, .restart {
                padding: 14px 30px;
                font-size: 19px;
            }
            .play { gap: 10px; }
            .hud {
                padding: 10px;
                font-size: 14px;
            }
            .stage-strip {
                min-height: 30px;
                font-size: 13px;
                padding: 5px 8px;
            }
            .call {
                gap: 12px;
                padding: 16px;
            }
            .line {
                min-height: 68px;
                line-height: 1.55;
            }
            .line { font-size: 18px; }
            .actions button {
                padding: 14px 8px;
                font-size: 17px;
            }
            .feedback {
                min-height: 44px;
                font-size: 14px;
            }
            .score { font-size: 36px; }
        }

        @media (max-height: 700px) {
            .game {
                border-width: 4px;
                border-radius: 14px;
                padding: 12px;
            }
            .title { gap: 12px; }
            .phone { font-size: 32px; }
            h1 { font-size: 28px; }
            .subtitle, .small { font-size: 13px; line-height: 1.5; }
            .rule, .panel {
                padding: 10px;
                line-height: 1.55;
                font-size: 13px;
            }
            .difficulty { gap: 6px; }
            .difficulty button {
                padding: 7px 9px;
                font-size: 13px;
            }
            .start, .restart {
                padding: 12px 26px;
                font-size: 18px;
            }
            .play { gap: 8px; }
            .hud {
                padding: 8px;
                font-size: 13px;
            }
            .stage-strip {
                min-height: 28px;
                font-size: 12px;
                padding: 4px 6px;
            }
            .call {
                gap: 10px;
                padding: 12px;
                border-width: 2px;
            }
            .line {
                min-height: 56px;
                font-size: 16px;
                line-height: 1.45;
            }
            .actions button {
                padding: 11px 6px;
                font-size: 16px;
            }
            .feedback {
                min-height: 40px;
                font-size: 13px;
                line-height: 1.4;
            }
            .result { gap: 8px; }
            .score { font-size: 32px; }
        }

        @media (min-width: 700px) and (min-height: 800px) {
            body { overflow: auto; }
            .game {
                height: 760px;
            }
        }
    </style>
</head>
<body>
    <main class="game">
        <section id="titleScreen" class="screen title active">
            <div>
                <div class="phone">☎</div>
                <h1>詐欺を切れ！</h1>
                <p class="subtitle">電話で判定ゲーム</p>
            </div>
            <div class="rule">
                <p><strong>ルール説明</strong></p>
                <p>電話の内容を2行で判定します。</p>
                <p>詐欺だと思ったら「切る」</p>
                <p>普通の電話なら「受ける」</p>
                <p>特に2行目の内容で判定してください。</p>
            </div>
            <p class="small">難易度を選択</p>
            <div class="difficulty">
                <button type="button" data-difficulty="easy">簡単</button>
                <button type="button" class="selected" data-difficulty="normal">通常</button>
                <button type="button" data-difficulty="hard">難題</button>
            </div>
            <button id="startButton" class="start" type="button">スタート</button>
        </section>

        <section id="gameScreen" class="screen play">
            <div class="hud">
                <div>Score: <span id="scoreValue">0000</span></div>
                <div><span id="callCount">1</span> / <span id="totalCalls">15</span>　連続:<span id="streakValue">0</span></div>
            </div>
            <div id="stageLabel" class="stage-strip">ステージ</div>
            <div class="call">
                <div id="line1" class="line"></div>
                <div id="line2" class="line"></div>
            </div>
            <div class="actions">
                <button id="acceptButton" class="accept" type="button" disabled>📞 受ける</button>
                <button id="cutButton" class="cut" type="button" disabled>✂ 切る</button>
            </div>
            <div id="feedback" class="feedback"></div>
        </section>

        <section id="resultScreen" class="screen result">
            <h2>ゲーム終了！</h2>
            <div>
                <p class="small">最終スコア</p>
                <p id="finalScore" class="score">0000</p>
            </div>
            <div>
                <p class="small">ランク</p>
                <p id="rankValue" class="score">-</p>
            </div>
            <div class="panel">
                <p>正解: <span id="correctCount">0</span> / <span id="totalCount">0</span></p>
                <p>正答率: <span id="correctRate">0</span>%</p>
            </div>
            <div class="panel">
                <p class="panel-title" id="diagnosisTitle">判定タイプ</p>
                <p id="diagnosisMessage"></p>
            </div>
            <div class="panel">
                <p class="panel-title">今回の危険ワード</p>
                <ul id="dangerWordList" class="chips"></ul>
                <p id="mistakeReview"></p>
            </div>
            <div class="panel">
                <p id="educationMessage"></p>
            </div>
            <button id="restartButton" class="restart" type="button">もう一度プレイ</button>
        </section>
    </main>

    <script>
        const questions = [
            { id: 1, category: 'fraud', line1: 'もしもし検察庁ですが。', line2: '口座の残高を教えてください。', correct: 'cut', stage: getStage('もしもし検察庁ですが。') },

            { id: 9, category: 'fraud', line1: '病院ですが。', line2: 'ご自宅に現金を取りに行きます。', correct: 'cut', stage: getStage('病院ですが。') },

            state.stageStats = {};

        function showTitle() {
            clearTimeout(state.timer);
            clearInterval(state.charTimer);

            show(titleScreen);
        }

        function nextQuestion() {
            clearTimeout(state.timer);
            clearInterval(state.charTimer);
            state.callCount += 1;
            state.canAnswer = false;
            setButtons(false);
            feedback.textContent = '';

            if (state.callCount > state.totalCalls) {
                showResult();
                return;
            }

            state.current = state.questionDeck[state.callCount - 1] || pickQuestion();
            state.usedIds.push(state.current.id);
            callCount.textContent = state.callCount;
            stageLabel.textContent = state.current.stage;
            line1.textContent = state.current.line1;
            line2.textContent = '';
            playSound('call');

            state.timer = setTimeout(() => {
                state.line2Start = Date.now();
                state.canAnswer = true;
                setButtons(true);
                revealLine2(state.current.line2);
            }, 620);
        }

        function revealLine2(text) {
            clearInterval(state.charTimer);
            line2.textContent = '';
            let index = 0;
            state.charTimer = setInterval(() => {
                line2.textContent += text[index] || '';
                index += 1;
                if (index >= text.length) clearInterval(state.charTimer);
            }, 26);
        }

        function answer(action) {
            if (!state.canAnswer || !state.current) return;

            state.canAnswer = false;
            setButtons(false);
            clearInterval(state.charTimer);
            line2.textContent = state.current.line2;

            const q = state.current;
            const responseTime = Math.max(0, (Date.now() - state.line2Start) / 1000);
            const correct = action === q.correct;
            const words = getDangerWords(q);
            let points = 0;

            if (correct) {
                playSound('correct');
                flashGame('correct');
                state.correctCount += 1;
                state.streak += 1;
                state.maxStreak = Math.max(state.maxStreak, state.streak);
                points = scoreFor(q.category, responseTime);
                feedback.style.color = '#70ff70';
                feedback.textContent = q.category === 'fraud' ? '正解！切りました！' : '正解！良い判断です';
            } else {
                playSound('wrong');
                flashGame('wrong');
                const setting = settings[state.difficulty];
                state.streak = 0;
                points = q.category === 'fraud' ? setting.fraudPenalty : setting.normalPenalty;
                feedback.style.color = '#ff7474';
                feedback.textContent = q.category === 'fraud' ? '危険な電話でした！' : '切ってしまいました';
                if (q.category === 'fraud') state.fraudMiss += 1;
                if (q.category === 'normal') state.normalMiss += 1;
            }

            if (q.category === 'fraud' && words.length > 0) {
                words.forEach(word => state.dangerCounts[word] = (state.dangerCounts[word] || 0) + 1);
                feedback.textContent += '\n危険ワード: ' + words.slice(0, 2).join(' / ');
            }

            state.score += points;
            recordStageResult(q, correct);
            state.answers.push({ q, correct, action, responseTime, words });
            updateScore();
            updateStreak();
            state.timer = setTimeout(nextQuestion, 1300);
        }

        function scoreFor(category, seconds) {
            const setting = settings[state.difficulty];
            const values = category === 'fraud' ? setting.fraudPoints : setting.normalPoints;
            const limits = category === 'fraud' ? [1.6, 2.2, 3.0] : [1.8, 2.5, 3.5];
            if (seconds <= limits[0]) return values[0];
            if (seconds <= limits[1]) return values[1];
            if (seconds <= limits[2]) return values[2];
            return values[3];
        }

        function updateScore() {
            const sign = state.score < 0 ? '-' : '';
            scoreValue.textContent = sign + String(Math.abs(state.score)).padStart(4, '0');
        }

        function updateStreak() {
            streakValue.textContent = state.streak;
        }

        function createQuestionDeck() {
            const perStage = 3;
            const stages = shuffle([...new Set(questions.map(q => q.stage))]);
            const deck = [];

            stages.forEach(stage => {
                const stageQuestions = questions.filter(q => q.stage === stage);
                const fraudCount = Math.round(perStage * settings[state.difficulty].fraudRatio);
                const normalCount = perStage - fraudCount;
                deck.push(...takeQuestions(stageQuestions, 'fraud', fraudCount));
                deck.push(...takeQuestions(stageQuestions, 'normal', normalCount));
            });

            while (deck.length < state.totalCalls) {
                deck.push(pickQuestion(deck.map(q => q.id)));
            }

            return shuffle(deck).slice(0, state.totalCalls);
        }

        function takeQuestions(pool, category, count) {
            return shuffle(pool.filter(q => q.category === category)).slice(0, count);
        }

        function pickQuestion(excludedIds = state.usedIds) {
            const setting = settings[state.difficulty];
            const wantFraud = Math.random() < setting.fraudRatio;
            let pool = questions.filter(q => q.category === (wantFraud ? 'fraud' : 'normal'));
            let available = pool.filter(q => !excludedIds.includes(q.id));
            if (available.length === 0) available = pool;
            return available[Math.floor(Math.random() * available.length)];
        }

        function shuffle(items) {
            const copied = [...items];
            for (let i = copied.length - 1; i > 0; i -= 1) {
                const j = Math.floor(Math.random() * (i + 1));
                [copied[i], copied[j]] = [copied[j], copied[i]];
            }
            return copied;
        }

        function getStage(line) {
            if (line.includes('警察') || line.includes('検察')) return '警察・検察なりすまし';
            if (line.includes('役所')) return '役所・手続き';
            if (line.includes('銀行')) return '銀行・カード';
            if (line.includes('病院')) return '病院・家族不安';
            return '生活連絡';
        }

        function getDangerWords(q) {
            if (q.category !== 'fraud') return [];
            const text = q.line1 + ' ' + q.line2;
            return dangerPatterns.filter(item => item[1].test(text)).map(item => item[0]);
        }

        function recordStageResult(q, correct) {
            if (!state.stageStats[q.stage]) {
                state.stageStats[q.stage] = { total: 0, correct: 0 };
            }

            state.stageStats[q.stage].total += 1;
            if (correct) state.stageStats[q.stage].correct += 1;
        }

            acceptButton.disabled = !enabled;
            cutButton.disabled = !enabled;
        }

            const total = state.answers.length;
            const rate = total > 0 ? Math.round((state.correctCount / total) * 100) : 0;
            const rank = getRank(state.score);
            const sign = state.score < 0 ? '-' : '';

            document.getElementById('finalScore').textContent = sign + String(Math.abs(state.score)).padStart(4, '0');
            document.getElementById('rankValue').textContent = rank;
            document.getElementById('correctCount').textContent = state.correctCount;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('correctRate').textContent = rate;
            showDiagnosis(rate);
            showReview();
            document.getElementById('educationMessage').textContent = '最大連続正解: ' + state.maxStreak + '。覚えておくこと: 警察・検察・銀行が電話で暗証番号や口座残高を聞くことはありません。不安な電話は、いったん切って家族や警察 #9110、消費者ホットライン 188 に相談しましょう。';
            playSound('ending');
            show(resultScreen);

        function unlockSounds() {
            if (soundsUnlocked) return;

            Object.values(sounds).forEach(sound => {
                try {
                    sound.load();

                }
            });
        }

        function playSound(name) {
            const sound = sounds[name];
            if (!sound) return;
            try {
                sound.pause();
                sound.currentTime = 0;
                const promise = sound.play();
                if (promise) promise.catch(() => {});
            } catch (error) {}
        }

            gameRoot.classList.remove('flash-correct', 'flash-wrong');
            void gameRoot.offsetWidth;
            gameRoot.classList.add('flash-' + type);
            setTimeout(() => gameRoot.classList.remove('flash-' + type), 260);
        }

        function getRank(score) {
            const ranks = settings[state.difficulty].ranks;
            if (score >= ranks[0]) return 'S';
            if (score >= ranks[1]) return 'A';
            if (score >= ranks[2]) return 'B';
            if (score >= ranks[3]) return 'C';
            return 'D';
        }

            const weakStage = getWeakStage();
            let title = '慎重バランス型';
            let message = '落ち着いて判定できています。迷う電話ほど、いったん切って相談する意識を持つとさらに安心です。';

            if (state.fraudMiss >= 2) {
                title = '危険ワード見落とし型';
                message = '詐欺電話を受けてしまう場面がありました。お金、カード、暗証番号、ATMが出たら、まず切る判断を優先しましょう。';
            } else if (state.normalMiss >= 3) {
                title = '警戒強め型';
                message = '怪しい電話を切る意識は強めです。お金や秘密を求めているかを見ると判定が安定します。';
            } else if (rate >= 90) {
                title = '即断ガード型';
                message = '危険な言葉への反応が速く、正確です。実際の電話でも、急かされても一度止まりましょう。';
            } else if (rate >= 80) {
                title = '安定判定型';
                message = 'かなり安定して見分けられています。繰り返すほど、危険ワードに自然と反応できます。';
            }

            if (weakStage) {
                message += ' 今回注意したい手口は「' + weakStage + '」です。';
            }

            document.getElementById('diagnosisTitle').textContent = title;
            document.getElementById('diagnosisMessage').textContent = message;
        }

        function showReview() {
            const list = document.getElementById('dangerWordList');
            const mistakes = document.getElementById('mistakeReview');
            list.textContent = '';

            const words = Object.entries(state.dangerCounts).sort((a, b) => b[1] - a[1]).slice(0, 6);
            if (words.length === 0) {
                const item = document.createElement('li');
                item.textContent = 'なし';
                list.appendChild(item);
            } else {
                words.forEach(([word, count]) => {
                    const item = document.createElement('li');
                    item.textContent = word + ' x' + count;
                    list.appendChild(item);
                });
            }

            const missed = state.answers.filter(item => !item.correct).slice(0, 3);
            if (missed.length === 0) {
                mistakes.textContent = 'ミスはありませんでした。危険ワードへの反応を維持しましょう。';
            } else {
                mistakes.textContent = missed.map(item => {
                    const picked = item.action === 'cut' ? '切る' : '受ける';
                    const expected = item.q.correct === 'cut' ? '切る' : '受ける';
                    const wordsText = item.words.length ? ' / ' + item.words.join('・') : '';
                    return 'ミス: ' + picked + ' → 正解は' + expected + wordsText;
                }).join('\n');
            }
        }

        function getWeakStage() {
            const entries = Object.entries(state.stageStats)
                .filter(([, stat]) => stat.total >= 2)
                .map(([stage, stat]) => ({ stage, rate: stat.correct / stat.total, total: stat.total }));

            if (entries.length === 0) return '';
            entries.sort((a, b) => a.rate - b.rate || b.total - a.total);
            return entries[0].rate < 1 ? entries[0].stage : '';
        }
    </script>
